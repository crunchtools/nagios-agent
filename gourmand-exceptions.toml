# ── New in Gourmand 1.0.0 (upstream v0.16.5) ────────────────────────────────
# CH001-absolute_paths did not exist in v0.1.0. Both entries below are the same
# architectural case: this repo ships a container filesystem, and the absolute
# paths are the contract with the NRPE daemon rather than an accident.

[[exceptions]]
check = "CH001-absolute_paths"
path = "rootfs/**"
classification = "by_design"
justification = "rootfs/ mirrors the container image's filesystem layout. The absolute paths ARE the contract: nrpe.cfg names the libexec paths the daemon execs, and the plugins reference the paths they are installed to. Making them relative would break every check on the host."

[[exceptions]]
check = "CH001-absolute_paths"
path = "deploy/**"
classification = "by_design"
justification = "nrpe-host.cfg and nrpe-ctr.cfg define NRPE commands by absolute libexec path. The path IS the command definition -- a relative path would not resolve for the daemon."
