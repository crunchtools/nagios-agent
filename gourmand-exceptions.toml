# Gourmand Exceptions
# Documented exceptions for files that legitimately trigger checks

# Random scripts — NRPE check plugins are not loose helper scripts. NRPE
# executes them by absolute path out of /usr/local/nagios/libexec, which is why
# they sit under rootfs/ at exactly the path they occupy in the built image.
# Moving them to scripts/ (Gourmand's suggested fix) would put them somewhere
# the daemon does not look and break every check on the host. They are the
# product this image ships, not organizational debt: each is referenced by a
# command[] entry in nrpe.cfg and by a Nagios service definition on the server,
# and each carries its own header documenting usage and thresholds.

[[exceptions]]
check = "random_scripts"
path = "rootfs/usr/local/nagios/libexec/check_cloudflare_status.sh"
justification = "NRPE plugin; must live at the libexec path the daemon executes it from. rootfs/ mirrors the image layout, so relocating it would break this check on the host."

