name: Build and Push Container Image

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday rebuild

jobs:
  # Blocking AI-slop gate, required by constitution XII. Referenced as a
  # reusable workflow rather than a copied job body, so fixes in gatehouse
  # reach this repo on the next CI run (RT #1468).
  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0.5.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          DOCKER_BUILDKIT=1 docker build --load -t nagios-agent:test -f Containerfile .

      - name: Verify image loaded
        run: |
          docker images nagios-agent:test
          docker run --rm --entrypoint sh nagios-agent:test -c "ls -la /usr/sbin/nrpe /usr/lib64/nagios/plugins/check_load" || true

      - name: Run tests
        run: |
          chmod +x tests/test-image.sh
          RUNTIME=docker IMAGE=nagios-agent:test ./tests/test-image.sh

      - name: Login to Quay.io
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to Quay.io
        if: github.ref == 'refs/heads/master'
        run: |
          docker tag nagios-agent:test quay.io/crunchtools/nagios-agent:latest
          docker push quay.io/crunchtools/nagios-agent:latest
