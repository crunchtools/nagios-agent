log_facility=daemon
pid_file=/run/nrpe/nrpe.pid
server_port=5666
nrpe_user=nrpe
nrpe_group=nrpe
dont_blame_nrpe=0
allow_bash_command_substitution=0
debug=0
command_timeout=60
connection_timeout=300

# Allow connections from any address since we run with --network=host
# and the Nagios server connects from the podman bridge gateway
allowed_hosts=127.0.0.1,10.88.0.0/16,::1

# Standard host checks
command[check_load]=/usr/lib64/nagios/plugins/check_load -r -w 5.0,4.0,3.0 -c 10.0,8.0,6.0
command[check_disk_root]=/usr/lib64/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_disk_srv]=/usr/lib64/nagios/plugins/check_disk -w 20% -c 10% -p /srv
command[check_swap]=/usr/lib64/nagios/plugins/check_swap -w 30% -c 15%
command[check_procs_total]=/usr/lib64/nagios/plugins/check_procs -w 400 -c 500
command[check_procs_zombie]=/usr/lib64/nagios/plugins/check_procs -w 5 -c 10 -s Z
command[check_users]=/usr/lib64/nagios/plugins/check_users -w 5 -c 10

# Custom checks
command[check_mem]=/usr/local/nagios/libexec/check_mem.sh -w 85 -c 95
command[check_systemd_units]=/usr/local/nagios/libexec/check_systemd_units.sh
