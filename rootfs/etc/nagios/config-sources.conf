# config-sources.conf — every service directory under /srv, and the OTHER git
# repo that could plausibly claim to own its configuration (RT #1498).
#
# Read by check_config_drift.sh. Format:
#
#   <srv-directory> <github-repo>[,<github-repo>...]|none
#
# /srv is itself a git repo (fatherlinux/lotor.dc3.crunchtools.com-srv) and it
# is the authoritative home for everything deployed. This file does not list
# it. It lists the RIVALS: the project repo that ships the same service, which
# is where a stale reference copy of a deployed config file goes to hide.
#
# WHY THIS CANNOT BE INFERRED. The directory name is the vhost, the repo name
# is the project, and they disagree often enough that guessing would be wrong
# rather than merely incomplete: mcp-feeds -> mcp-feed-reader, mcp-gsc ->
# mcp-google-search-console, mcp-jira -> mcp-atlassian, mcp-rt ->
# mcp-request-tracker, mcp-wiki -> mcp-mediawiki, mcp-memory -> memory,
# mail -> postfix, rootsofthevalley.org -> rotv, both gateways -> a single
# google-workspace-mcp, both WordPress MCPs -> a single mcp-wordpress.
#
# A SERVICE'S RIVAL IS NOT ALWAYS THE REPO OF THE SAME NAME. signal-api is
# deployed as its own service directory but its unit is shipped by the openclaw
# repo, which is what actually runs it. Mapping it to "none" because no
# "signal-api" repo exists meant nobody compared it, and it had drifted -- the
# deployed unit joins openclaw-pod and runs MODE=normal, the repo copy
# published a port and MODE=json-rpc. Ask what ships the service, not what
# shares its name.
#
# WHAT RUNS THE SERVICE IS THE QUESTION, and the answer is in its systemd unit:
# whatever image it pulls names the repo that builds that image. kagetora runs
# quay.io/crunchtools/hermes and the four WordPress sites run the shared
# ubi10-httpd-php* base images. None of those repos carries a copy of the
# deployed config TODAY, which is precisely why they are listed -- "we looked
# and found nothing" and "nobody ever looked" are the same green tile until
# somebody adds a file.
#
# "none" IS AN ANSWER, not a gap. A service with no project repo has exactly
# one git home already, which is the state this check exists to enforce. Say
# so explicitly: an unlisted directory is counted as unmapped and named in the
# output, because silently not looking is how the 2026-09-20 outage stayed
# invisible.
#
# A SERVICE CAN HAVE MORE THAN ONE RIVAL, hence the comma-separated list.
# /srv/nagios.crunchtools.com/config/services/ is claimed by the nagios repo
# and by nagios-agent, which keeps reference copies of its own Nagios service
# definitions under deploy/nagios/. Listing only the obvious one would have
# hidden six files, including this check's own service definition.
#
# A repo listed here is only read -- one shallow blobless clone per run, over
# https, no token. Private repos would fail that read and be reported as
# unchecked rather than clean; none are listed today.

