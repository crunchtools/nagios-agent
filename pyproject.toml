# Lint settings for the Python plugins (the Hermes probes) and their tests.
# No pytest rules (PT): the tests are standard-library unittest, like the probes.
# Not a Python package: the plugins are single files run by NRPE, and the
# Hermes probes are sent alone into the Kagetora container, so they import
# nothing outside the standard library.
#
# The [project] table below exists only so `uv lock` can pin the gate's own
# tools; `package = false` keeps uv from trying to build or install this repo.
[project]
name = "nagios-agent"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

# mypy and pytest must be IN the lockfile or the gate exits 2 rather than
# pretending to pass (python-sdlc, need_lock_dep).
[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101 is pytest's assert. S603 and S607 are for check_deployer.sh's test: the
# thing under test IS a shell plugin, so testing it means executing it. The
# argument vector is a path computed from __file__ plus a tmp_path, with no
# input from anywhere else -- which is the condition S603 asks about.
"tests/*" = ["S101", "S603", "S607"]

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 12

# The probes and their tests. They are loose files, not a package, so mypy is
# pointed at them by path.
[tool.mypy]
files = ["rootfs/usr/local/nagios/libexec", "tests"]
python_version = "3.10"

[tool.sdlc.push]
# No in-repo Semgrep rules: the gate exits 2 when .semgrep is absent rather
# than scanning nothing and reporting a pass. CodeQL still runs.
skip = ["semgrep"]
