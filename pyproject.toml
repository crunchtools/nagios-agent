# Lint settings for the Python plugins (the Hermes probes) and their tests.
# No pytest rules (PT): the tests are standard-library unittest, like the probes.
# Not a Python package: the plugins are single files run by NRPE, and the
# Hermes probes are sent alone into the Kagetora container, so they import
# nothing outside the standard library.
#
# The [project] table below exists only so `uv lock` can pin the gate's own
# tools; `package = false` keeps uv from trying to build or install this repo.
[project]
name = "nagios-agent"
version = "0"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

# mypy and pytest must be IN the lockfile or the gate exits 2 rather than
# pretending to pass (python-sdlc, need_lock_dep).
[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101 is pytest's assert. S603 and S607 are for check_deployer.sh's test: the
# thing under test IS a shell plugin, so testing it means executing it. The
# argument vector is a path computed from __file__ plus a tmp_path, with no
# input from anywhere else -- which is the condition S603 asks about.
"tests/*" = ["S101", "S603", "S607"]

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 12

# The probes and their tests. They are loose files, not a package, so mypy is
# pointed at them by path.
[tool.mypy]
files = ["rootfs/usr/local/nagios/libexec", "tests"]
python_version = "3.10"

[tool.sdlc.push]
# No in-repo Semgrep rules: the gate exits 2 when .semgrep is absent rather
# than scanning nothing and reporting a pass. CodeQL still runs.
skip = ["semgrep"]

[tool.sdlc]
repo-kinds = ["container-image"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/nagios-agent"
# NRPE is a bare daemon: no units, no HEALTHCHECK, and no stdio or HTTP server
# for the mcp profiles. The gate it ran lives in `image-gate` below.
boot = "none"
boot-none-reason = "NRPE daemon with no units or HEALTHCHECK; the image-gate ci check asserts nrpe, its config, plugins and libraries inside this image (nrpe itself cannot start with no capabilities)"

[tool.sdlc.ci]
checks = ["nagios-agent-image", "image-gate", "plugin-harness", "plugin-tests", "hermes-probes"]

[tool.sdlc.ci.nagios-agent-image]
kind = "image-build"

# What tests/test-image.sh asserted, run inside the built image instead of
# driven from outside by podman (tests/image/boot-check.sh). argv[0] replaces
# the image's NRPE entrypoint. Not the nrpe-running and port-5666 checks: with
# every capability dropped nrpe exits at startup, so the script asserts its
# shared libraries instead.
[tool.sdlc.ci.image-gate]
kind = "command"
image = "localhost/nagios-agent:sdlc"
argv = ["bash", "tests/image/boot-check.sh"]

# The offline plugin suite, which test-image.sh ran last on the GitHub runner.
# It stubs curl, rclone and the podman socket against the repo's own rootfs, so
# it needs no nagios-agent image, only the runner's tools (flock, cmp, sqlite3,
# gawk, python3): tests/Containerfile.plugins. No gawk apt-get needed any more.
[tool.sdlc.ci.plugin-harness]
kind = "image-build"
containerfile = "tests/Containerfile.plugins"
context = "tests"
tag = "localhost/nagios-agent:plugins"

[tool.sdlc.ci.plugin-tests]
kind = "command"
image = "localhost/nagios-agent:plugins"
argv = ["bash", "tests/test-plugins.sh"]

# The Hermes probe unittests, on the gate's own python 3.14.
[tool.sdlc.ci.hermes-probes]
kind = "command"
argv = ["python3", "-m", "unittest", "-q", "tests/test_hermes_probes.py"]
