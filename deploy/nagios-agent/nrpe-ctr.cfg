# =============================================================================
# NRPE — SLOW POOL (podman + external APIs)   port 5667
# =============================================================================
# 135 checks, in two groups:
#   - podman-backed container checks: serialise on the container-state
#     database, and are the original saturation source.
#   - external-API checks (Cloudflare, Quay, factory health): not podman, but
#     they block on somebody else's network, so they belong with "allowed to
#     be slow" rather than with the always-answer diagnostics.
#
# This pool is EXPECTED to degrade under load — that is the design. When it
# does, the Nagios dependency on "NRPE daemon (containers)" collapses all
# dependents into one correlated alert instead of 135 separate emergencies,
# while the fast pool on :5666 keeps reporting the CPU and I/O numbers that
# explain it.
#
# Longer timeouts than the fast pool: podman under load legitimately takes
# seconds, and that is not by itself a fault.
# =============================================================================
# /dev/log does not exist in this container by default, so this line
# silently discarded every message. The unit now bind-mounts the host
# journal socket at /dev/log. Do NOT point this at /dev/stdout instead:
# NRPE redirects its own stdout to /dev/null before it opens the log,
# so the messages go to /dev/null and nothing reports an error.
log_facility=daemon
pid_file=/run/nrpe/nrpe.pid
server_port=5667
nrpe_user=nrpe
nrpe_group=nrpe
dont_blame_nrpe=0
allow_bash_command_substitution=0
debug=0
command_timeout=60
connection_timeout=300
allowed_hosts=127.0.0.1,10.88.0.0/16,::1

