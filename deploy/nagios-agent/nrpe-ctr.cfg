# OAuth token expiry — LinkedIn issues 60-day tokens with no refresh token,
# and Postiz silently queues posts forever once one lapses. The day thresholds
# only apply to channels like that; channels Postiz renews on its own (threads)
# are exempt from them and alert only once actually broken or expired.
command[check_postiz_tokens]=/usr/local/nagios/libexec/check_postiz_tokens.sh 21 7

# Hermes/Kagetora messaging platform adapters.
# Added 2026-09-12 after the Matrix sync loop sat dead for 3.5 days behind a
# green "container runs" + "container memory" pair. The real check runs
# host-side on hermes-probe.timer (/var/lib/hermes-probe/) because the evidence
# lives in a 0700 dir whose logs hold conversations; this command only collects
# the published verdict and fails CRITICAL if that verdict has gone stale.
command[check_ctr_hermes_platforms_kagetora]=/usr/local/nagios/libexec/check_hermes_probe.sh /run/hermes-probe/kagetora.state 300
command[check_ctr_hermes_context_kagetora]=/usr/local/nagios/libexec/check_hermes_probe.sh /run/hermes-probe/kagetora-context.state 300


# --------------------------------------------------------------------------
# Google OAuth refresh tokens for the gw-personal / gw-work MCP backends.
#
# Fully self-contained Nagios check -- no external scheduler, no state file.
# The nrpe user cannot read the 0600 credential files and must not be able to,
# so the check asks each backend container to test its own credential over the
# podman socket, the same way check_postiz_tokens.sh does.
# --------------------------------------------------------------------------
command[check_gw_oauth_personal]=/usr/local/nagios/libexec/check_google_oauth.sh personal
command[check_gw_oauth_work]=/usr/local/nagios/libexec/check_google_oauth.sh work

# --- NRPE pool cross-watch (RT #1459) -----------------------------------------
# The fast pool is watched from the slow pool and vice versa, so neither daemon
# can die unobserved. A container that is OOM-killed is back in ~2s under
# Restart=always, which every "is it running" check happily reports as OK; only
# uptime carries the evidence. crit window (300s) >= this service check_interval.
command[check_ctr_restart_nagios_agent]=/usr/local/nagios/libexec/check_container_restart.sh nagios-agent.crunchtools.com 300 900

# --- Factory watchdog verdict (RT #1478) --------------------------------------
# The watchdog evaluates every repo in the org hourly. Until this check existed
# its only output was 8 Zabbix trapper items pushed at a decommissioned server,
# so ~47 repos' health went to a dead socket. Reads the status file straight off
# the host bind mount: no credential, no podman exec, no dependency on the
# dashboard process (constitution XVI). Staleness is the CRITICAL case -- a dead
# watchdog leaves a file full of reassuring numbers.
command[check_factory_status]=/usr/local/nagios/libexec/check_factory_status.sh /srv/factory.crunchtools.com/data/factory-status.json 120 20 30
