# =============================================================================
# NRPE — FAST POOL (host metrics + local TCP)   port 5666
# =============================================================================
# 41 checks. None touch the podman socket or the network beyond a
# local connect. They read /proc, stat a filesystem, or open a socket on
# 127.0.0.1. Each costs single-digit milliseconds.
#
# WHY THIS POOL EXISTS
# All 176 checks previously shared one NRPE daemon. 135 of them block on
# something outside this daemon's control — 125 shell out to `podman inspect`
# / `podman stats`, which serialise on the container-state database, and 10
# call external APIs. When lotor got busy those queued, NRPE's per-connection
# children piled up behind them, and new connections timed out.
#
# The checks that tell you WHY the box is unhealthy — load, memory, disk, CPU,
# failed units — died as collateral, because they sat in the same queue.
# Reading /proc/loadavg costs nothing and cannot fail, yet it failed anyway.
# That is backwards: you went blind exactly when you needed to see.
#
# Measured: 431 "socket timeout after 30 seconds" in seven days, plus a live
# saturation event 2026-08-25 22:57 UTC — 26 checks failed at once at load
# 8.53/CPU.
#
# command_timeout is deliberately short. Nothing here should take 15s, so if
# something does, that is real signal rather than queueing.
# =============================================================================
# /dev/log does not exist in this container by default, so this line
# silently discarded every message. The unit now bind-mounts the host
# journal socket at /dev/log. Do NOT point this at /dev/stdout instead:
# NRPE redirects its own stdout to /dev/null before it opens the log,
# so the messages go to /dev/null and nothing reports an error.
log_facility=daemon
pid_file=/run/nrpe/nrpe.pid
server_port=5666
nrpe_user=nrpe
nrpe_group=nrpe
dont_blame_nrpe=0
allow_bash_command_substitution=0
debug=0
command_timeout=15
connection_timeout=60
allowed_hosts=127.0.0.1,10.88.0.0/16,::1

command[check_load]=/usr/lib64/nagios/plugins/check_load -r -w 5.0,4.0,3.0 -c 10.0,8.0,6.0
command[check_disk_root]=/usr/lib64/nagios/plugins/check_disk -w 20% -c 10% -p /
command[check_disk_srv]=/usr/lib64/nagios/plugins/check_disk -w 20% -c 10% -p /srv
command[check_swap]=/usr/lib64/nagios/plugins/check_swap -w 30% -c 15%
command[check_procs_total]=/usr/lib64/nagios/plugins/check_procs -w 1100 -c 1300
command[check_procs_zombie]=/usr/lib64/nagios/plugins/check_procs -w 15 -c 30 -s Z
command[check_users]=/usr/lib64/nagios/plugins/check_users -w 5 -c 10
command[check_mem]=/usr/local/nagios/libexec/check_mem.sh -w 85 -c 95
command[check_systemd_units]=/usr/local/nagios/libexec/check_systemd_units.sh
command[check_quay_pull_source]=/usr/local/nagios/libexec/check_quay_pull_source.sh
command[check_tcp_8002]=/usr/local/nagios/libexec/check_tcp_local.sh 8002
command[check_tcp_8003]=/usr/local/nagios/libexec/check_tcp_local.sh 8003
