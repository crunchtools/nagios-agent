command[check_syslog_disk]=/usr/local/nagios/libexec/check_syslog_disk.sh /srv/syslog.crunchtools.com/data/logs 10 20
command[check_tcp_8027]=/usr/local/nagios/libexec/check_tcp_local.sh 8027
command[check_tcp_8028]=/usr/local/nagios/libexec/check_tcp_local.sh 8028
command[check_diskio]=/usr/local/nagios/libexec/check_diskio.sh -d sda -w 80 -c 95
command[check_cpu_stats]=/usr/local/nagios/libexec/check_cpu_stats.sh -W 20 -C 40 -s 10 -S 30
command[check_net_throughput]=/usr/local/nagios/libexec/check_net_throughput.sh -i enp0s3 -w 800 -c 950
command[check_backup_freshness]=/usr/local/nagios/libexec/check_backup_freshness.sh

# Nightly in-container DB dumps, read on disk under /var/srv rather than in
# pCloud (RT #1497). Counterpart to check_backup_freshness, which only sees the
# weekly pCloud copy and so cannot tell a dead nightly cron from a fresh one for
# up to seven days. Escalates to root via podman_exec like the drift checks,
# because postiz writes its dump 0600.
command[check_nightly_dump]=/usr/local/nagios/libexec/check_nightly_dump.sh

# /srv config-repo drift (RT #1466). Reads the status file published by
# srv-git-drift.timer; does not touch /var/srv, which holds .env and keys.
command[check_git_drift]=/usr/local/nagios/libexec/check_git_drift.sh

# Running units vs their /srv copies (RT #1466). Same status file as
# check_git_drift; guards the /etc -> /srv door rather than /srv -> git.
command[check_unit_drift]=/usr/local/nagios/libexec/check_unit_drift.sh

# The third drift door (RT #1498): a deployed config file that TWO git repos
# both claim. check_git_drift measures /srv against its own origin and by
# construction cannot see a rival repo disagreeing -- which is exactly how the
# 2026-09-20 proxy outage happened. Same collector split: the plugin runs
# unprivileged and does the network half, config-drift-collect.sh runs as root
# in this container and does the /var/srv half.
command[check_config_drift]=/usr/local/nagios/libexec/check_config_drift.sh

# --- NRPE pool cross-watch (RT #1459) -----------------------------------------
# Counterpart to check_ctr_restart_nagios_agent on the :5667 pool. See the note
# there; each daemon reports on the other so an OOM kill cannot self-conceal.
command[check_restart_nagios_agent_ctr]=/usr/local/nagios/libexec/check_container_restart.sh nagios-agent-ctr.crunchtools.com 300 900

# RT #1490: are the plugins running the ones we released?
command[check_plugin_drift]=/usr/local/nagios/libexec/check_plugin_drift.sh
