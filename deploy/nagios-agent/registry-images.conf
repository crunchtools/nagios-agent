# registry-images.conf — every crunchtools-authored container image, and the
# repo whose git tags are the source of truth for its version.
#
# Read by check_registry_drift.sh. Format:
#
#   <github-repo> <image-name> [fork]
#
# The image name is often NOT the repo name (spanish -> mundo-de-palabras,
# newsletter -> kill-the-newsletter) and several repos publish more than one
# image, so this mapping cannot be inferred from the repo list alone.
#
# "fork" marks a forked project, which is skipped by the version comparison
# entirely. Two reasons, and the second is the one that matters: Constitution
# Section III exempts forks from the GHCR dual-push, AND a fork's git tags are
# UPSTREAM's release tags, not ours. crunchtools/mcp-atlassian carries git tags
# v0.17.0/v0.18.0/v0.18.1 inherited from sooperset, while the image we publish
# is tagged only latest and main. Comparing the two compares unrelated things
# and would flag forever. Forks are covered by Quay staleness instead.
#
# DELIBERATELY ABSENT: rhel10-bootc-workstation. It is the only non-public repo
# in the fleet, so `git ls-remote` and the anonymous GHCR token cannot read it
# without credentials this container does not have and should not need. It is
# covered instead by the check_quay_rhel10_bootc_workstation service, which
# only touches the public Quay API. Its sibling rhel10-bootc-server IS public
# and IS checked here -- the two repos are not configured alike.
#
# To regenerate the body of this file, walk the org rather than local
# checkouts (a filesystem-based audit silently misses whatever is not cloned --
# that is how RT #1480 undercounted the fleet by a third):
#
#   gh repo list crunchtools --limit 300 --json name,isArchived,visibility \
#     --jq '.[]|select(.isArchived==false)|select(.visibility=="PUBLIC")|.name'
#
# then read each repo's .github/workflows/ over the API and pull out every
# quay.io/crunchtools/<name> and IMAGE_NAME/BASE_IMAGE/TEST_IMAGE it publishes.

