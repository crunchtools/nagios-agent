# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/unit-drift.cfg
#
# Guards the second door (RT #1466). "Git Drift /srv" watches /srv -> git.
# This watches /etc -> /srv, which nothing was watching:
#
#   edit /etc/systemd/system/foo.service live to fix something
#   /srv/foo/config/foo.service is untouched, still matches git
#   every check reads green, and git now holds a definition that is wrong
#
# Found on nagios-agent.crunchtools.com.service, where the committed copy was
# missing the rclone mounts check_backup_freshness needs -- restoring from git
# would have broken backup verification. 11 units had drifted that way and 38
# more were running with no /srv copy at all, most of the MCP fleet among them.
#
# OK under 4h, WARNING after (nagios-agent 7.0.0). Each drifted unit is dated
# by the newer mtime of its two copies (an unbacked unit by its /etc copy), so
# the edit-reload-restart-then-copy-back of a normal unit deploy no longer
# shows. WARNING notifies nobody (hermes is CRITICAL-only).
#
# Same collector as Git Drift: srv-drift-collect.sh, run as root in
# nagios-agent.crunchtools.com via podman_exec.sh (RT #1477). UNKNOWN means
# that exec failed, not that everything matches.
# =============================================================================

define service {
    use                     nrpe-fast-service-slow
    host_name               lotor.dc3.crunchtools.com
    service_description     Unit Drift /etc
    check_command           check_nrpe_command!10.88.0.1!check_unit_drift
    notes                   A running unit has not matched its /srv copy, or has had none, for over 4h. Usually /etc is the correct side: copy it to /srv/<svc>/config/ and commit. UNKNOWN means the srv-drift-collect.sh exec failed.
}
