# =============================================================================
# lotor host-level performance metrics — Nagios service definitions
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/lotor-host-metrics.cfg
#
# These checks run via NRPE on the nagios-agent container (--network=host,
# --pid=host) and read directly from /proc on the host. Each uses a state
# file for delta-based rate calculation, so the first check after agent
# restart returns "collecting baseline" and starts reporting on the next
# interval.
#
# Prerequisite: the three NRPE commands (check_diskio, check_cpu_stats,
# check_net_throughput) must be in the nagios-agent nrpe.cfg.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor
    service_description     Disk I/O
    check_command           check_nrpe_command!10.88.0.1!check_diskio
    notes                   %util from /proc/diskstats with perfdata for read/write IOPS and KB/s. Linode shared storage — high util means neighbor contention or real load.
}

define service {
    use                     crunchtools-service
    host_name               lotor
    service_description     CPU Stats
    check_command           check_nrpe_command!10.88.0.1!check_cpu_stats
    notes                   CPU breakdown from /proc/stat. Alerts on iowait (blocked on I/O) and steal (hypervisor taking CPU). User/system/idle in perfdata.
}

define service {
    use                     crunchtools-service
    host_name               lotor
    service_description     Network Throughput
    check_command           check_nrpe_command!10.88.0.1!check_net_throughput
    notes                   eth0 throughput in Mbps from /proc/net/dev. Low priority — Cloudflare fronts everything. Generous thresholds (800/950 Mbps).
}
