# =============================================================================
# Cross-repo config drift — Nagios service definition (RT #1498)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/config-drift.cfg
#
# The third drift door, and the one that was standing open. Git Drift /srv
# guards /srv -> its own git. Unit Drift guards /etc -> /srv. Neither can see
# a deployed file that TWO git repos both claim.
#
# On 2026-09-20 proxy.crunchtools.com.conf was tracked by
# fatherlinux/lotor.dc3.crunchtools.com-srv (deployed, bind-mounted) and by
# crunchtools/proxy (a reference copy, four vhosts behind). Syncing the host
# file from the second one deleted trentina, mcp-gw-personal, mcp-gw-work and
# mcp-pcloud, and josui's gateway answered 403 until the backup was restored.
# Both drift checks read green throughout, correctly: from inside either repo
# nothing had drifted. The comparison nobody was making was between them.
#
# check_nrpe_ctr, NOT check_nrpe_command. There are two nrpe daemons on this
# host and both answer on 10.88.0.1: the host agent on 5666 (nrpe-host.cfg)
# and the container agent on 5667 (nrpe-ctr.cfg). Getting this wrong fails with
# "NRPE: Command 'check_config_drift' not defined", which reads like a missing
# plugin rather than a wrong port.
#
# This started on the host agent beside check_git_drift and check_unit_drift,
# which is where it looks like it belongs, and that was wrong. It makes ~34
# shallow clones per run: measured 3s, 3s, 11s, 11s and 5s on five consecutive
# runs against that daemon's 15s command_timeout, and it had already returned
# "NRPE: Command timed out" once in production. More parallelism does not help
# -- the cost is per-clone latency, not concurrency. It belongs on the 60s
# daemon beside check_registry_drift, which does the same kind of work for the
# same reason.
#
# Nothing is lost by moving it. The plugin itself never reads /var/srv: the
# privileged half runs as root via podman_exec.sh inside
# nagios-agent.crunchtools.com, which has the tree mounted, and both agents
# bind-mount the same libexec directory.
#
# check_interval 60. It makes one shallow blobless clone per project repo,
# about 30 per run. That takes ~2s and tells you nothing new in between: a
# reference copy that has been stale for months does not become stale faster
# for being asked twice an hour.
#
# WHAT CRITICAL MEANS HERE, given hermes pages on CRITICAL only. Two cases,
# both narrow on purpose:
#   - a deployed file is BOTH absent from origin/master AND contradicted by a
#     rival repo. That is not a latent hazard, it is the 2026-09-20 state
#     itself: the live file was overwritten from a home that is not
#     authoritative. Whoever is awake needs to know before the next recreate.
#   - a deployed .env, key or wp-config.php also exists in a project repo.
#     Constitution XVII, and no divergence required to qualify.
# Everything else -- a rival copy that merely disagrees -- is WARNING, which
# colours the dashboard and wakes nobody.
#
# ON STARTING RED, and the note at the end of registry-drift.cfg.
#
# This ships WARNING with 9 divergent files across 6 repos: acquacotta,
# factory, mcp-syslog, openclaw, postiz, spanish and syslog each keep a stale
# copy of a deployed unit or conf. The list IS the work, and it is tracked
# separately rather than left to the dashboard. The plugin takes
# CONFIG_DRIFT_MAX_DIVERGENT as a ratchet: pin it at today's count and walk it
# down as the copies are deleted, rather than letting an amber tile become
# furniture. It ships at 0 because the backlog is small enough to actually
# finish.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Config drift cross-repo
    check_command           check_nrpe_ctr!10.88.0.1!check_config_drift
    check_interval          60
    retry_interval          15
    notes                   WARNING when a deployed file under /srv/<service>/config/ also exists in that service's project repo with different content -- two git homes, and syncing from the wrong one changes production (RT #1498). Fix by deleting the stale reference copy from the project repo; config is bind-mounted from /srv per Constitution XIV, so the project repo has no business carrying it. CRITICAL means either a deployed secret file is also in a public repo (Constitution XVII) or a file is simultaneously unpublished and contradicted by its rival -- the 2026-09-20 proxy outage state. Files under rootfs/ in a project repo are image content and are deliberately ignored. UNKNOWN means repos could not be read, not that nothing drifted.
}
