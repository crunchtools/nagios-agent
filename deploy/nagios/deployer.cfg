# =============================================================================
# Deploy robot holds — Nagios service definition (crunchtools/deployer#1)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/deployer.cfg
#
# The deployer rolls a service back when a deploy does not verify, and writes a
# hold file so the host's nightly `podman auto-update` skips that service. The
# skip is implemented by a static ExecCondition drop-in on
# podman-auto-update.service. This check watches the pair: the holds, and
# whether anything is still honouring them.
#
# The CRITICAL that matters is "a hold exists and the drop-in does not". Then
# the hold is protection that is not there, and the image that was rolled back
# goes live again at 03:00. The deployer refuses to run at all in that state,
# so it is also telling you why no deploys are happening.
#
# The other CRITICAL is the opposite problem: a hold that has stood 24 hours.
# While it stands nothing else on the host auto-updates either, so a forgotten
# hold quietly freezes fleet updates. It wants a person, not a restart.
#
# check_nrpe_command, NOT check_nrpe_ctr. Two nrpe daemons answer on
# 10.88.0.1: the host agent on 5666 and the container agent on 5667. This check
# reads the HOST -- /var/lib/deployer and a systemctl property -- so it belongs
# to the host agent. Getting this wrong fails with "NRPE: Command
# 'check_deployer' not defined", which reads like a missing plugin rather than
# a wrong port.

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Deployer
    check_command           check_nrpe_command!10.88.0.1!check_deployer
    check_interval          10
    retry_interval          5
    notes                   OK means no deploy holds and the auto-update hold guard is installed. WARNING means a service is held after a rollback (the alert names the unit, its age and the ticket -- read that ticket), or the deployer could not run at all, or its last outcome is one this check does not recognise (the check and the deployer have drifted apart), or the guard is missing while nothing is held yet. CRITICAL means either a hold exists and nothing honours it, so the rolled-back image goes live at the next auto-update and the deployer is refusing every ticket until the drop-in is restored; or a hold has stood 24h, which freezes auto-update for the whole host until someone runs `deployer unhold <service>`; or a rollback itself failed to verify, which means a service is down and needs a person. UNKNOWN means /var/lib/deployer could not be read, which on a host with no deployer installed is expected. A ticket the deployer REFUSED is deliberately not reported here: that is a decided state, the deployer exits 0 for one, and the stalled ticket owned by whoever filed it is the channel.
}
