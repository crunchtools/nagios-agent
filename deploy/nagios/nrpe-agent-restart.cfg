# =============================================================================
# NRPE agent cross-watch — restart detection for both agent pools
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/nrpe-agent-restart.cfg
# Companion to nrpe-dependency.cfg, which documents the two-pool split and its
# liveness probes. Read that header first; this file closes one gap it leaves.
#
# The liveness probes in nrpe-dependency.cfg answer "is the daemon answering
# right now". They cannot answer "did it die and come back between polls",
# which is the failure that hid RT #1459 for a day:
#
#   check_backup_freshness spiked the fast agent to ~490MB against a 512m cap,
#   the kernel OOM-killed the NRPE daemon, systemd's Restart=always had it
#   listening again ~2s later. The next poll found it healthy. The only trace
#   was "connect to address 10.88.0.1 port 5666: Connection refused" in the
#   Nagios log and a SOFT CRITICAL that self-cleared. Seven kills on
#   2026-09-19, and nothing ever reached a HARD state or paged.
#
# Each pool watches the OTHER pool's container, so neither daemon is the sole
# witness to its own death. The evidence is container uptime: these units run
# with --rm, so a restart yields a fresh container and StartedAt is the only
# field that moves (RestartCount stays 0).
#
# max_check_attempts is 2, not 1. A planned agent restart trips this too, which
# is correct — the monitoring agent going down is worth knowing about — but
# paging on the first sample for every deploy would train the operator to
# ignore it. Use scheduled downtime for planned agent work.
#
# MIND THE COMMAND MACRO. The two services below cross over, so they do NOT use
# the same one:
#   check_nrpe_command  -> :5666 (fast pool)       — serves check_restart_nagios_agent_ctr
#   check_nrpe_ctr      -> :5667 (container pool)  — serves check_ctr_restart_nagios_agent
# Pairing a service with the wrong macro asks the wrong daemon and yields
# "NRPE: Command '<name>' not defined" as an UNKNOWN, not a CRITICAL — easy to
# skim past. Caught here the first time by this check reporting on itself.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     NRPE agent restart fast pool
    check_command           check_nrpe_ctr!10.88.0.1!check_ctr_restart_nagios_agent
    check_interval          5
    retry_interval          1
    max_check_attempts      2
    notes                   Served by the :5667 pool, reporting on the :5666 agent. CRITICAL means nagios-agent.crunchtools.com restarted within the last 5 minutes. Check `journalctl -u nagios-agent.crunchtools.com` and grep the journal for "killed by the OOM killer" before assuming it was a deploy.
}

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     NRPE agent restart container pool
    check_command           check_nrpe_command!10.88.0.1!check_restart_nagios_agent_ctr
    check_interval          5
    retry_interval          1
    max_check_attempts      2
    notes                   Served by the :5666 pool, reporting on the :5667 agent. CRITICAL means nagios-agent-ctr.crunchtools.com restarted within the last 5 minutes. Same triage as the fast-pool counterpart.
}
