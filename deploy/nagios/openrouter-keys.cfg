# =============================================================================
# OpenRouter keys and Trentina L3 refusals (Nagios services)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/openrouter-keys.cfg
#
# Trentina judges each profile's traffic on that profile's own OpenRouter key.
# On 2026-11-22 JOSUI_OPENROUTER_API_KEY reached its $150 monthly limit and
# three profiles lost L3, unnoticed until reads failed (a953). One service
# per key reads its limit_remaining from inside the trentina container:
# WARNING at 20% left, CRITICAL at 5% or nothing left.
#
# "Trentina L3 403s" counts "QuarantineAgentError status=403" in the trentina
# log over 10 minutes: WARNING over 5, CRITICAL over 20. It sees the outage
# itself, whichever key or provider caused it.
#
# check_interval 30: the key endpoint is free, but spend moves slowly and the
# warning threshold is days ahead of the limit.
# =============================================================================

define service {
    use                     nrpe-ctr-service
    host_name               ctr-trentina.crunchtools.com
    service_description     OpenRouter Key JOSUI
    check_command           check_nrpe_ctr!10.88.0.1!check_openrouter_key_josui
    check_interval          30
    retry_interval          10
    notes                   Shared by the josui, dolza-max and exedore-max profiles: the fleet's L3 single point of failure. Spend left on this L3 key before OpenRouter refuses it with 403 (scope key_limit) until the limit resets on the 1st. Raising the limit is in the OpenRouter console and spends money, so it is Scott's call; no restart is needed after. HTTP 401/403 means the key itself was refused.
}

