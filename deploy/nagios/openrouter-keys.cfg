define service {
    use                     nrpe-ctr-service
    host_name               ctr-trentina.crunchtools.com
    service_description     Trentina L3 403s
    check_command           check_nrpe_ctr!10.88.0.1!check_trentina_l3_403
    check_interval          5
    retry_interval          2
    notes                   L3 calls refused with HTTP 403 in the last 10 minutes. Seats get refusals or unjudged content while this is red. Usually an OpenRouter key at its limit: look at the OpenRouter Key services, or podman logs --since 10m trentina | grep -B2 'status=403' to see which path (Q-Agent detection, compress) is failing.
}
