# =============================================================================
# Deploy drift — Nagios service definition
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/deploy-drift.cfg
#
# Registry drift stops at the registry. The weekend report of 2026-10-24 found
# mcp-systemd, mcp-podman and mcp-notebooklm a release or two behind on lotor
# with every check green: their units ran :latest without the autoupdate label,
# so podman-auto-update never moved them. postfix had sat the same way since
# May, and on 2026-10-26 podman-auto-update.timer itself was found masked, with
# the whole fleet frozen and nothing alerting.
#
# This check catches both shapes: "unmanaged" (no label) at once, "stale"
# (label present, running digest behind Quay) once the tag is older than the
# 30h grace that covers the daily 03:00 ET auto-update run.
#
# check_nrpe_ctr, not check_nrpe_command: the command lives in nrpe-ctr.cfg on
# port 5667 beside check_registry_drift. See registry-drift.cfg for the
# "Command not defined" symptom of getting this wrong.
#
# check_interval 60: tags move a few times a day and auto-update once.
# =============================================================================

define service {
    use                     nrpe-ctr-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Deploy drift
    check_command           check_nrpe_ctr!10.88.0.1!check_deploy_drift
    check_interval          60
    retry_interval          15
    notes                   WARNING when a running quay.io/crunchtools container will not or did not pick up its newest image. "unmanaged": pulled by tag with no io.containers.autoupdate=registry label, so releases never land -- add the label to the unit in /srv and /etc. "stale": labelled, but the running digest is not what the tag points at on Quay and the tag is over 30h old -- podman-auto-update is not running or failing; read its journal. Digest-pinned images are deliberate and only counted. UNKNOWN means lookups failed, not that the fleet is clean.
}
