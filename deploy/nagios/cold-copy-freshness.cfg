# =============================================================================
# Cold copy freshness — the independent medium (Nagios service definition)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/cold-copy-freshness.cfg
#
# THIS IS THE CHECK THE MICRO-SD NEVER HAD. Until 2026-11-08 the only copy of
# Scott's personal data outside the pCloud account was a 512 GB micro-SD. It had
# been broken since at least 2026-11-02 — 628 GiB of source against a 469 GiB
# card, full, contents owned by the wrong uid — and nobody noticed for months,
# because nothing watched it. It was retired on 2026-11-07 (RT#1547). The 4 TB
# drive that replaced it is only an improvement while this service exists.
#
# Judges the markers pbs 2.6.0's ColdCopy module writes to
# pcloud:Backups/Rotations/ColdCopy.<fqdn>, read by the same
# backup-freshness-collect.sh run and the same status file as Personal Backup
# Freshness — one `rclone cat` serves both, so this adds no pCloud read.
#
# RUNS ON gloval, NOT ON THE HOST HOLDING THE DRIVE. The drive is only present
# when Scott docks and unlocks it, so a check beside it could only report while
# it was already running. Reading the marker from pCloud means a laptop that is
# off, or a drive nobody plugged in, is exactly the condition that alerts. It
# also means nothing here changes when the drive moves to a dedicated host — the
# check follows the hostname in the marker.
#
# WARN 10d / CRIT 24d. The sync is triggered by unlocking the drive, not by a
# timer (pbs systemd/breetai/cold-copy.sh explains why), so the cadence is
# however often Scott docks. Three missed weeks is a trip; four is the micro-SD
# happening again.
#
# check_interval is 30 for the reason given in backup-freshness.cfg: thresholds
# are in days, and every run is a pCloud API call from a memory-capped agent.
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Cold Copy Freshness
    check_command           check_nrpe_command!10.88.0.1!check_cold_copy_freshness
    check_interval          30
    retry_interval          5
    notes                   The only copy of this data outside the pCloud account. Red means the cold copy went stale, its last rclone sync exited non-zero, or no marker exists at all — which is what a drive nobody plugged in looks like, and is the intended alert, not a false one. Fix: dock breetai and unlock the drive; ColdCopy.path starts the sync. UNKNOWN means the collector is stale, not a bad backup.
}
