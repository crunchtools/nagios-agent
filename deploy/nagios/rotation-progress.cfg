# =============================================================================
# Backup rotations — a rotation wedged in flight (Nagios service definition)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/rotation-progress.cfg
#
# WHAT THIS CLOSES. RT #1594 made every pbs rotation hold a systemd block
# shutdown inhibitor for the life of its run, so an OS update cannot reboot the
# host mid-backup — it is refused and retried every 30 minutes until the
# rotation finishes. Verified live: a rotation held an update off for over three
# hours. That coupling turned "a rotation that never finishes" into "this host
# never takes an OS update again", silently, and nothing watched for it.
#
# Backup Freshness and Personal Backup Freshness cannot: they judge the MARKERS
# a rotation writes when it COMPLETES, so a run wedged at hour three is
# indistinguishable from one that never started, and their thresholds are 16 and
# 100 days. A wedge surfaced a fortnight late, as staleness.
#
# THE SIGNAL IS PROGRESS, AND IT TAKES TWO SOURCES. Elapsed time cannot judge
# this: ServerBackups-Weekly-1 runs ~10h normally and PersonalBackups-Weekly-1
# ~16m. rclone's byte counter cannot judge it alone either. On 2026-11-09 a
# personal rotation 39 days stale sat at "22.978 GiB / 22.978 GiB, 100%, 0 B/s"
# byte-identical for two and a half hours, 4h20m in, inside a --delete-during
# pass that --stats-one-line does not count. That run was SLOW, not wedged, and
# what proved it was CPU: about half a CPU-second a minute, continuously. Host
# networking leaves no per-container network counters to use instead.
#
# So a rotation is stuck only when NEITHER its byte counter NOR its CPU time has
# moved for its window: 45m for a personal rotation, 2h for a server one. Either
# one moving is progress, and progress is silent.
#
# WARNING, not CRITICAL, for a stall: a stuck backup blocking OS updates is not
# an emergency. CRITICAL needs BOTH stalled AND past the lifetime ceiling (12h
# personal, 24h server), which means the run cannot finish and updates have been
# refused for half a day. A run past the ceiling that is still moving warns.
#
# THIS NEVER KILLS ANYTHING. Bounding a run's lifetime would kill a backup that
# might be slow rather than stuck, which is the behaviour RT #1594 was filed to
# stop. Visibility is the job.
#
# check_interval 5 is the sampling clock, not oversampling: the plugin starts
# rotation-progress-collect.sh when its status file is over 4m old, and the
# CPU-time delta between two of those samples is the whole signal. Each run is
# one local socket listing plus two small reads per in-flight rotation, and most
# of the week there is no rotation in flight at all.
#
# max_check_attempts 3 is deliberate. The frozen windows are 45m and 2h, so a
# genuine stall is still there three checks later; a single odd sample (a
# collector run that lost a race with a container exiting) clears by itself.
# =============================================================================

define service {
    use                     nrpe-ctr-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Backup rotation progress
    check_command           check_nrpe_ctr!10.88.0.1!check_backup_rotation_progress
    check_interval          5
    retry_interval          5
    max_check_attempts      3
    notes                   A pbs rotation is in flight and neither its rclone byte counter nor its CPU time has moved for its window, so it will never finish and its block shutdown inhibitor is holding OS updates off (RT #1594). The first line names the rotation, how long it has run and how long nothing has moved. Check that rotation's journal (journalctl -u ServerBackups-* / PersonalBackups-*) and the pCloud session, then decide whether to let it run or stop the unit — this check never stops one. WARNING on a stall; CRITICAL only when it is also past its lifetime ceiling. UNKNOWN means the sampling collector is stale or a sample failed, not a bad backup.
}
