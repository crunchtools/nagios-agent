# =============================================================================
# Backup freshness — pCloud dump-age check (Nagios service definition)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/backup-freshness.cfg
#
# Runs check_backup_freshness on the nagios-agent via NRPE: per-service dump
# sentinels in ServerBackups Weekly-1 (WARN 9d / CRIT 16d, plus a per-dump size
# floor) and representative dumps in Monthly-1/2 (WARN 70d / CRIT 100d — the
# two rotations alternate months).
#
# Since nagios-agent 7.0.0 the plugin reads a status file that
# backup-freshness-collect.sh writes to /var/lib/nagios-agent (lotor:
# /srv/nagios-agent.crunchtools.com/data), and starts that collector detached
# when the file is over 20m old, so this service's check_interval is also the
# collection clock. The collector has 120s for the 19 listings instead of 12s;
# the live reads used to time out on slow pCloud (11 UNKNOWNs in 48h). UNKNOWN
# now means only "collector stale": the file is missing or over 2h old, or one
# sentinel has not been read for 2h. rclone and /etc/rclone.conf stay
# ro-mounted into the agent for the collector. Decommissioned services (zabbix)
# are intentionally absent from the sentinel list.
#
# The history below is about the live check and is kept for the reasoning;
# the collector still runs its listings in waves of 7 for the same memory
# reason, but outside NRPE.
#
# check_interval is 30, NOT the crunchtools-service default of 1. This check is
# the single most expensive thing the fast NRPE pool runs: 19 pCloud sentinels
# in waves of 7, each rclone process ~70MB RSS, measured peak 490MB and
# check_execution_time 10.3s. At the inherited 1-minute interval that spike
# landed inside the agent container every 60s and sat at ~96% of its then-512m
# cgroup cap; any concurrent check tipped it over and the kernel OOM-killed the
# NRPE daemon. The daemon came back in ~2s under Restart=always, so the only
# trace was "connect to address 10.88.0.1 port 5666: Connection refused" in the
# Nagios log and a SOFT CRITICAL that self-cleared — silent monitoring
# blindness, RT #1459. Seven OOM kills on 2026-09-19 before it was caught.
#
# 30 minutes is still absurd oversampling for thresholds measured in DAYS (WARN
# 9d): it detects a missed weekly dump ~432 checks before that dump goes
# warning. It also cuts pCloud API load from ~27,360 listings/day to ~912.
# The agent cap was raised 512m -> 1g in the same change for headroom; both
# levers matter, because the cap alone still leaves a 490MB spike every minute.
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Backup Freshness
    check_command           check_nrpe_command!10.88.0.1!check_backup_freshness
    check_interval          30
    retry_interval          5
    notes                   Judges the status file backup-freshness-collect.sh writes (120s pCloud budget, run from this check when the file is over 20m old). The first line names the worst sentinel. CRITICAL means a dump is missing, stale, or shrank below its size floor — check the pbs Servers run and the pCloud session token. UNKNOWN means the collector is stale (status file missing or over 2h old, or a sentinel unread for 2h), not a bad backup: check /srv/nagios-agent.crunchtools.com/data and the podman socket.
}
