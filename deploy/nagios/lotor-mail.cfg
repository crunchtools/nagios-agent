# lotor.dc3.crunchtools.com keeps mail.crunchtools.com until Hetzner lifts
# gloval's outbound port 25 (RT #1546). gloval's Nagios reaches lotor's NRPE
# agents through the mail tunnel: 10.88.0.1:15666 (host) and :15667 (containers).
# Remove this file, and point ctr-mail back at 10.88.0.1, when mail moves.

define command {
    command_name    check_nrpe_lotor
    command_line    $USER1$/check_nrpe -H 10.88.0.1 -p 15666 -c $ARG1$ -t 30
}

define command {
    command_name    check_nrpe_lotor_ctr
    command_line    $USER1$/check_nrpe -H 10.88.0.1 -p 15667 -c $ARG1$ -t 45
}

define host {
    use                 crunchtools-host
    host_name           lotor.dc3.crunchtools.com
    alias               lotor.dc3.crunchtools.com (mail only, Linode)
    address             172.105.105.45
    check_command       check_nrpe_lotor!_NRPE_CHECK
    max_check_attempts  5
    contact_groups      admins
}

define service {
    use                 crunchtools-service
    host_name           lotor.dc3.crunchtools.com
    service_description Mail tunnel to gloval
    check_command       check_nrpe_lotor!check_smtp_relay
    contact_groups      admins
}
