# =============================================================================
# Personal backup freshness — pbs rotation markers (Nagios service definition)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/personal-backup-freshness.cfg
#
# Runs check_personal_backup_freshness on the nagios-agent via NRPE. The
# PersonalBackups-* units sync Documents, Downloads, Autosync and Projects
# pCloud-to-pCloud into Weekly-1 (WARN 9d / CRIT 16d) and Monthly-1/2 (WARN 70d
# / CRIT 100d — the two rotations alternate months). pbs writes a marker per
# directory and rotation after each sync; the plugin reads all twelve with one
# rclone call (crunchtools/pbs#16).
#
# The plugin needs rclone and /etc/rclone.conf ro-mounted into the agent
# container, the same mounts check_backup_freshness uses.
#
# check_interval is 30 for the reason given in backup-freshness.cfg: thresholds
# are in days, and every run is a pCloud API call from a memory-capped agent.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Personal Backup Freshness
    check_command           check_nrpe_command!10.88.0.1!check_personal_backup_freshness
    check_interval          30
    retry_interval          5
    notes                   Reads the markers pbs writes to pcloud:Backups/Rotations. Red means a personal rotation never ran, went stale, or its last rclone sync exited non-zero. The long output names the directory and rotation; check that PersonalBackups unit's journal on lotor, then the pCloud session token.
}
