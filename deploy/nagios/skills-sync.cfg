# =============================================================================
# Skills sync — is every seat running current josui-skills? (Nagios services)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/skills-sync.cfg
#
# A josui-skills merge used to reach no seat until it restarted, and nothing
# said so (crunchtools/developer#42). The seats now fast-forward every 10
# minutes and write a marker; each host's skills-sync-push timer copies them
# to pcloud:Monitoring/SkillsSync, and check_skills_sync.sh judges them here.
#
# RUNS ON gloval, NOT ON DOLZA OR EXEDORE: neither has an NRPE agent, so the
# markers come by pCloud, as Cold Copy Freshness does from Exedore.
#
# One service per host, the worst seat first in the output. WARN after 1h of
# drift, CRIT after 6h; a marker missing, or older than 30m, warns too,
# because a dead sync loop must not look healthy.
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc1.crunchtools.com
    service_description     Skills Sync dolza
    check_command           check_nrpe_command!10.88.0.1!check_skills_sync_dolza
    check_interval          10
    retry_interval          5
    notes                   Dolza's shared josui-skills checkout, kept by Josui Prime's sync loop and read-only in every other seat. Drift means a merge has not reached the seats. diverged means local commits: the sync never merges, look at ~/Projects/dolza-services/josui/data/josui-skills. A stale or missing marker means Prime's loop or the host's skills-sync-push.timer stopped: systemctl --user status skills-sync-push.timer on dolza, podman logs josui | grep skills-sync.
}

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc1.crunchtools.com
    service_description     Skills Sync exedore
    check_command           check_nrpe_command!10.88.0.1!check_skills_sync_exedore
    check_interval          10
    retry_interval          5
    notes                   Each Max seat's own josui-skills checkout at /srv/maxN/data/josui-skills, synced inside the seat. The output names the worst seat. diverged means local commits: the sync never merges, a person must look. A stale or missing marker means that seat's loop or the host's skills-sync-push.timer stopped: podman logs maxN | grep skills-sync, systemctl --user status skills-sync-push.timer on exedore.
}
