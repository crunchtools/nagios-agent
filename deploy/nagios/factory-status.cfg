# =============================================================================
# Factory watchdog verdict — Nagios service definition (RT #1478)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/factory-status.cfg
#
# The factory watchdog evaluates every repo in the org each hour — GHA runs,
# constitution compliance, version drift, published artifacts — and writes the
# findings to factory-status.json. Until this service existed the only thing it
# did with them was push 8 trapper items to a Zabbix server decommissioned
# during RT #1459, so every verdict went to a dead socket on 127.0.0.1:10051
# and failed there every ~56 minutes. ~47 repos' health was evaluated hourly
# and discarded.
#
# Nagios already watched the factory container and the dashboard process, so a
# dead container would have paged. What nobody could learn was that the repos
# themselves were failing — a monitoring gap one layer above the one RT #1459
# was opened for.
#
# THRESHOLDS ALERT ON REGRESSION, NOT ON THE STANDING DEBT.
#
# This first shipped as warn=1, which meant it sat WARNING permanently against
# a fleet that has had failing repos for months. The reasoning was that a check
# reporting OK while half the org fails would be lying. That was wrong, and it
# carried an incoherent instruction to "ratchet warn down" from a value that
# was already at its floor.
#
# A permanently-red check is not honest, it is ignored — the same failure mode
# constitution XVI warns about for flaky detectors. The absolute level is not
# lost by making this green: repos_failing rides in the perfdata on every run
# and is graphable, and the dashboard names which repos. An ALERT exists to say
# "act now"; a known multi-month backlog is not that.
#
# Baseline 2026-09-19: 17 failing of 48. warn=20 tolerates ordinary churn and
# fires if three more break; crit=30 is a real cliff.
#
# RATCHET BOTH DOWN as the fleet improves — a threshold left far above the
# actual count is a check that has quietly stopped working. Review whenever the
# failing count drops meaningfully (RT #1479 milestones are the natural
# trigger). Never raise them to silence a real regression; that is how the
# Zabbix push became invisible in the first place.
#
# check_interval 15: the watchdog writes hourly, so polling faster only re-reads
# the same file. Staleness is caught by the plugin's own age test (120m), which
# is the CRITICAL case — a watchdog that stopped leaves a file full of
# reassuring numbers, and reading it without checking its age is how a
# monitoring system reports OK about a job that died days ago.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Factory repo health
    check_command           check_nrpe_ctr!10.88.0.1!check_factory_status
    check_interval          15
    retry_interval          5
    notes                   Watchdog verdict across every repo in the org, read from factory-status.json. CRITICAL means either the watchdog stopped writing (check `podman logs factory.crunchtools.com` and its timer) or failures crossed the crit threshold. WARNING means the failing count REGRESSED past the baseline — see the dashboard at http://127.0.0.1:8095/ for which repos. The absolute count is always in perfdata (repos_failing), green or not.
}
