# =============================================================================
# Factory watchdog verdict — Nagios service definition (RT #1478)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/factory-status.cfg
#
# The factory watchdog evaluates every repo in the org each hour — GHA runs,
# constitution compliance, version drift, published artifacts — and writes the
# findings to factory-status.json. Until this service existed the only thing it
# did with them was push 8 trapper items to a Zabbix server decommissioned
# during RT #1459, so every verdict went to a dead socket on 127.0.0.1:10051
# and failed there every ~56 minutes. ~47 repos' health was evaluated hourly
# and discarded.
#
# Nagios already watched the factory container and the dashboard process, so a
# dead container would have paged. What nobody could learn was that the repos
# themselves were failing — a monitoring gap one layer above the one RT #1459
# was opened for.
#
# THRESHOLDS ARE A RATCHET, NOT A TARGET. warn=1 / crit=30 against 22 currently
# failing, so this sits WARNING from the day it is switched on. That is the
# honest reading: 22 of 47 repos really are failing, and a check reporting OK
# would be lying. It is deliberately NOT paging-critical, because 22 failures
# accumulated over months is technical debt, not a 2am incident. As repos are
# fixed, ratchet warn down so regressions keep surfacing. Do not raise warn to
# silence it — that is how the Zabbix push became invisible in the first place.
#
# check_interval 15: the watchdog writes hourly, so polling faster only re-reads
# the same file. Staleness is caught by the plugin's own age test (120m), which
# is the CRITICAL case — a watchdog that stopped leaves a file full of
# reassuring numbers, and reading it without checking its age is how a
# monitoring system reports OK about a job that died days ago.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Factory repo health
    check_command           check_nrpe_ctr!10.88.0.1!check_factory_status
    check_interval          15
    retry_interval          5
    notes                   Watchdog verdict across every repo in the org, read from factory-status.json. CRITICAL means either the watchdog stopped writing (check `podman logs factory.crunchtools.com` and its timer) or failures crossed the crit threshold. WARNING is the standing repo-health debt — see the dashboard at http://127.0.0.1:8095/ for which repos.
}
