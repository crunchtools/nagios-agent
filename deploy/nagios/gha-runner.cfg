# GitHub Actions runners on gloval (crunchtools/gha-runner): cached takes our
# pull requests, uncached takes pushes to main (the build that gets published).
#
# Each is a one-job runner: the container exits after every job and systemd
# starts a fresh one, so a check landing in that gap sees "activating" for a few
# seconds. max_check_attempts 4 at a 1-minute retry is what separates that from
# a runner that cannot start, which loops for as long as it is broken.

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc4.crunchtools.com
    service_description     GHA runner cached
    check_command           check_nrpe_command!10.88.0.1!check_gha_runner_cached
    max_check_attempts      4
    retry_interval          1
    notes                   gha-runner-cached.crunchtools.com: pull-request CI for repos in the org's gloval runner group. CRITICAL means the unit is failed, stopped or restart-looping; read journalctl -u gha-runner-cached.crunchtools.com. Kill switch: clear CACHED_RUNNER_LABEL in the repo's Actions variables and jobs go to GitHub-hosted.
}

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc4.crunchtools.com
    service_description     GHA runner uncached
    check_command           check_nrpe_command!10.88.0.1!check_gha_runner_uncached
    max_check_attempts      4
    retry_interval          1
    notes                   gha-runner-uncached.crunchtools.com: builds what main publishes. CRITICAL means the unit is failed, stopped or restart-looping; read journalctl -u gha-runner-uncached.crunchtools.com. Kill switch: clear UNCACHED_RUNNER_LABEL in the repo's Actions variables and main builds on GitHub-hosted.
}
