# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/selinux-drift.cfg
#
# Local SELinux customizations (booleans, ports, file-context rules) live in
# /var/lib/selinux, outside pbs's /etc backup and bootc's /etc merge. The host
# re-applies /srv/selinux-local/config/local.semanage at boot
# (selinux-local.service); this warns when the live state has drifted from
# that file, so a hand fix gets recorded before a restore loses it (RT #1546).
#
# Collector: selinux-drift-collect.sh, run as root in
# nagios-agent.crunchtools.com via podman_exec.sh. UNKNOWN means that exec
# failed, not that everything matches. WARNING notifies nobody (hermes is
# CRITICAL-only).
# =============================================================================

define service {
    use                     nrpe-fast-service-slow
    host_name               gloval.dc1.crunchtools.com
    service_description     SELinux Drift
    check_command           check_nrpe_command!10.88.0.1!check_selinux_drift
    notes                   Live SELinux customizations differ from /srv/selinux-local/config/local.semanage. Keep the change: semanage export > /srv/selinux-local/config/local.semanage and commit. Undo it: systemctl restart selinux-local.
}
