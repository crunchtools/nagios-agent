# =============================================================================
# OpenBao on agentless hosts — Nagios service (a259)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/openbao-remote.cfg
#
# Exedore runs its own OpenBao (a256) holding only the Max seats' secrets, and
# has no NRPE agent. Its openbao-health-push timer copies /v1/sys/health and the
# newest raft snapshot's time to pcloud:Monitoring/OpenBao every 10 minutes;
# check_openbao_remote.sh judges that here, the route Skills Sync takes.
#
# WHAT CRITICAL MEANS. Nothing consumes exedore's store yet (the seats still
# read podman secrets). After the cutover, every seat's srv-secrets@ oneshot
# fetches from it, so sealed means no seat can start.
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc1.crunchtools.com
    service_description     OpenBao exedore
    check_command           check_nrpe_command!10.88.0.1!check_openbao_remote_exedore
    check_interval          10
    retry_interval          5
    notes                   Exedore's own secret store (a256), seen through a marker its openbao-health-push timer copies to pCloud. CRITICAL when sealed, not initialised or unreachable, when there is no raft snapshot or the newest is over 50h old, or when no marker has arrived for 6h. WARNING on a snapshot over 26h or a marker over 45m. The seal is static, so sealed means /srv/openbao/creds/unseal.key is missing or unreadable by uid 2200100: journalctl -u openbao on exedore. Snapshots: systemctl status openbao-snapshot.timer, /srv/openbao/snapshots. A stale marker: systemctl status openbao-health-push.timer. Runbook /srv/openbao/README.md on exedore.
}
