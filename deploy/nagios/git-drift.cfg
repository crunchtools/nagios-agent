# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/git-drift.cfg
#
# Alerts when /srv config has been out of sync with its git repo (RT #1466).
#
# The failure this exists to catch: the trentina.crunchtools.com vhost was
# added live, never committed, and a container recreate discarded it -- the
# default vhost answered 403. Config that is not committed is config you are
# one recreate away from losing, silently and with no diff to recover from.
#
# Two conditions, because they are different mistakes:
#   uncommitted   edited on disk, never committed
#   unpushed      committed locally, never pushed -- the box is still the
#                 only copy, so a disk loss takes it with them
#
# OK under 4h ("within grace"), WARNING at 4h, CRITICAL at 24h. The age is
# stateless: the oldest mtime among dirty files, or the oldest unpushed
# commit's date. WARNING was 1h until nagios-agent 7.0.0, which is shorter than
# an ordinary deploy, so every deploy coloured the dashboard and the weekend
# report. hermes is CRITICAL-only (contacts.cfg), and normal edit-then-commit
# never reaches 24h. Thresholds are the plugin's WARN/CRIT env defaults.
#
# HOW IT MEASURES (RT #1477). check_git_drift.sh runs srv-drift-collect.sh as
# root inside nagios-agent.crunchtools.com via podman_exec.sh, against the
# /var/srv ro mount, and gets back counts, timestamps and names only. nrpe
# itself never reads /var/srv -- that tree holds ~25 .env files and several
# private keys. The old srv-git-drift.timer and its status file are gone.
# UNKNOWN means the collector exec failed or answered garbage, not that the
# repo is clean.
# =============================================================================

define service {
    use                     nrpe-fast-service-slow
    host_name               lotor.dc3.crunchtools.com
    service_description     Git Drift /srv
    check_command           check_nrpe_command!10.88.0.1!check_git_drift
    notes                   Uncommitted or unpushed config in /var/srv, older than 4h. Fix by committing and pushing on lotor; the check clears on its next run. UNKNOWN means the srv-drift-collect.sh exec in nagios-agent.crunchtools.com failed, not that the tree is clean.
}
