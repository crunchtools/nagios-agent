# =============================================================================
# Release follower — Nagios service definition (crunchtools/deployer 0.8.0)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/release-follow.cfg
#
# release-follow runs hourly and files an RT Deploy ticket, as RT user
# `follower`, when a followed service's :latest is newer than what it runs. A
# ticket the deployer hands back is stalled and owned by `follower`, which no
# person reads, so the follower lists every one in its status file and this
# check is the only thing that turns one into an alert.
#
# Install this only once release-follow.crunchtools.com.timer is enabled: a
# missing status file is UNKNOWN, the same treatment check_deployer.sh gives a
# missing /var/lib/deployer.
#
# check_nrpe_command (host agent, port 5666), beside Deployer: it reads one
# file under /var/lib/deployer, which only the host agent had mounted when this
# was written. Getting the port wrong fails with "NRPE: Command
# 'check_release_follow' not defined".
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc1.crunchtools.com
    service_description     Release follower
    check_command           check_nrpe_command!10.88.0.1!check_release_follow
    check_interval          30
    retry_interval          10
    notes                   WARNING when a follower ticket is stalled (the alert names ticket, service and commit -- read it in the RT Deploy queue: the deployer handed it back, and nobody reads RT user follower's queue; deploy it or resolve it), when the last pass did not end ok (degraded: a registry row could not be judged; could-not-run: config, credential or RT trouble -- read `journalctl -u release-follow.crunchtools.com`), when the status file has no end=1, or when the last pass is 3h old, which means release-follow.crunchtools.com.timer stopped. UNKNOWN means the status file is missing: the follower has never run, or /var/lib/deployer is not mounted into the host agent.
}
