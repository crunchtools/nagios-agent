# =============================================================================
# Fleet image CVEs — Nagios service definition (RT #1551)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/image-cve.cfg
#
# The runtime replacement for the per-repo build-time Trivy gate. The grype
# oneshot (quay.io/crunchtools/grype) scans the fleet every 6h and writes
# cve.status; check_image_cve.sh reads it and pages on CHANGE, not on the
# standing backlog — a page on the known backlog would teach the fleet to ignore
# the one signal that matters. Routing:
#   CRITICAL  a NEW fixable Critical CVE — one whose (image, CVE) is NOT in the
#             accepted baseline (cve-baseline.conf): a new CVE, a known CVE in a
#             new image, or (fail-safe) a counted Critical with no finding line.
#             Page. The fix is a version BUMP (base/dependency), NOT a same-commit
#             rebuild — a rebuild does not clear a pinned-version Critical.
#   WARNING   a fixable High CVE                     -> bump within 6h
#   UNKNOWN   the scan is missing/stale, the scanner DB is >48h old, or a listed
#             image is absent from the scan (a coverage gap, which never masks a
#             CRITICAL). UNKNOWN notifies — a scanner that silently stopped is
#             the failure this check exists to prevent.
#   OK        only unfixable findings, clean, or fixable Criticals that are ALL
#             baselined (known, accepted; counted as baselined_crit, never paged).
#
# One service for the whole fleet; the output names the offending images. Image
# AGE staleness is NOT judged here — check_quay_staleness.sh owns that; this
# owns CVE severity.
#
# check_nrpe_ctr, NOT check_nrpe_command: the plugin runs in the container agent
# (nrpe-ctr.cfg, port 5667), where the cve.status file and the fleet list are
# mounted. Getting this wrong fails "NRPE: Command 'check_image_cve' not
# defined", which reads like a missing plugin rather than a wrong port.
#
# check_interval 60: the plugin only reads two local files, but the scan behind
# it moves every 6h, so polling faster tells you nothing new.
#
# ON STARTING RED. The first real scan may show a backlog of images with fixable
# criticals. That backlog is SEEDED into the accepted baseline (cve-baseline.conf)
# at go-live, so it is counted (baselined_crit) but does not page; paging is
# enabled only after the seed. From then on a page means a REGRESSION — a Critical
# that broke out of the accepted set — not the standing backlog. Handled in the
# go-live item, not by softening this check.
# =============================================================================

# notification_options c,u,r — NOT the template's w,u,c,r. A fixable High
# (WARNING) has no baseline: every base-image High across the fleet would page
# and re-page, which is the exact alert-fatigue the Critical baseline exists to
# prevent, one tier down. So WARNING is visible on the board but does NOT page;
# it is worked from the enqueue backlog. CRITICAL (a NEW fixable Critical) pages,
# UNKNOWN pages (a silently-dead scanner is the failure this check exists to
# catch), and RECOVERY closes the loop.
define service {
    use                     nrpe-ctr-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Fleet image CVEs
    check_command           check_nrpe_ctr!10.88.0.1!check_image_cve
    check_interval          60
    retry_interval          15
    notification_options    c,u,r
    notifications_enabled   0
    notes                   CRITICAL when a published fleet image carries a NEW fixable Critical CVE — one not in the accepted baseline (cve-baseline.conf): a new CVE, a known CVE in a new image, or a counted Critical with no finding line. Baselined Criticals are known and do NOT page (counted as baselined_crit). WARNING for a fixable High. Routes the grype scan in cve.status; unfixable findings are OK (accepted and documented in .trivyignore). UNKNOWN means the scan is stale, the scanner's vulnerability DB is older than 48h, or a listed image is missing from the scan — a coverage gap, not a clean fleet. Image age staleness is a separate check (check_quay_staleness). The fix for a CRITICAL is a version BUMP (base or dependency); a same-commit rebuild does not clear a pinned-version Critical.
}
