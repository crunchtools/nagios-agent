# =============================================================================
# Fleet image CVEs — Nagios service definition (RT #1551)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/image-cve.cfg
#
# The runtime replacement for the per-repo build-time Trivy gate. The grype
# oneshot (quay.io/crunchtools/grype) scans the fleet every 6h and writes
# cve.status; check_image_cve.sh reads it and routes:
#   CRITICAL  a fixable Critical CVE in some image  -> page, and rebuild
#   WARNING   a fixable High CVE                     -> rebuild within 6h
#   UNKNOWN   the scan is missing/stale, the scanner DB is >48h old, or a listed
#             image is absent from the scan (a coverage gap, which never masks a
#             CRITICAL). UNKNOWN notifies — a scanner that silently stopped is
#             the failure this check exists to prevent.
#   OK        only unfixable findings, or clean.
#
# One service for the whole fleet; the output names the offending images. Image
# AGE staleness is NOT judged here — check_quay_staleness.sh owns that; this
# owns CVE severity.
#
# check_nrpe_ctr, NOT check_nrpe_command: the plugin runs in the container agent
# (nrpe-ctr.cfg, port 5667), where the cve.status file and the fleet list are
# mounted. Getting this wrong fails "NRPE: Command 'check_image_cve' not
# defined", which reads like a missing plugin rather than a wrong port.
#
# check_interval 60: the plugin only reads two local files, but the scan behind
# it moves every 6h, so polling faster tells you nothing new.
#
# ON STARTING RED. The first real scan may show a backlog of images with fixable
# criticals. That is handled in the go-live item (notifications disabled for the
# baseline run, the count recorded on RT #1551 and burned down or accepted,
# then paging enabled) — not by softening this check.
# =============================================================================

define service {
    use                     nrpe-ctr-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Fleet image CVEs
    check_command           check_nrpe_ctr!10.88.0.1!check_image_cve
    check_interval          60
    retry_interval          15
    notifications_enabled   0
    notes                   CRITICAL when a published fleet image carries a FIXABLE Critical CVE (a rebuild or bump clears it); WARNING for a fixable High. Routes the grype scan in cve.status; unfixable findings are OK (nothing to do — they are accepted and documented in .trivyignore). UNKNOWN means the scan is stale, the scanner's own vulnerability DB is older than 48h, or a listed image is missing from the scan — a coverage gap, not a clean fleet. Image age staleness is a separate check (check_quay_staleness). The fix for a CRITICAL is a rebuild (base refresh) or, if it survives that, a dependency bump.
}
