# =============================================================================
# linux-mcp-server — Josui Prime's administration path (Nagios service def)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/linux-mcp-server.cfg
#
# RT #1568. rhel-lightspeed's linux-mcp-server runs as root on gloval, bound
# to one address on the crunchtools bridge, reached only through the Trentina
# gateway. It is how the agent administers this host; the josui-rescue ssh
# forced command stays underneath it for a gateway outage.
#
# check_service_running rather than a new plugin: the unit is Restart=always,
# so a broken one loops between auto-restart and activating and never reaches
# failed, which is the gap that check was written for. Its NRestarts output
# makes a loop visible at a glance.
#
# Not a port check. The port admits the gateway's address and nothing else,
# so probing it from the monitoring container would mean widening that rule
# for a root script-execution service -- a worse trade than the coverage buys.
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc1.crunchtools.com
    service_description     Linux MCP Server
    check_command           check_nrpe_command!10.88.0.1!check_linux_mcp_server
    notes                   Josui Prime's administration path into gloval, reached through Trentina. CRITICAL when the unit is inactive, failed or restart-looping; WARNING while it is starting. Inactive almost always means /etc/linux-mcp-server/linux-mcp.env is gone or the nftables fence in /etc/nftables-linux-mcp.conf is not loaded -- the unit requires the first to start at all and its preflight refuses without the second. Check journalctl -u linux-mcp-server. The josui-rescue ssh path is unaffected and still works.
}
