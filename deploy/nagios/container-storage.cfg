# =============================================================================
# Container storage — nested podman image stores (Nagios service definition)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/container-storage.cfg
#
# developer1-3 and gha-runner-cached each run their own podman inside the
# service container, with its own storage under /srv/<svc>/data/containers.
# Nothing removed anything from them: on 2026-11-08 they held 1,190,137 files
# and 49.5 GiB, mostly the same image over and over, because podman-auto-update
# pulls python-sdlc most days and developer1 was carrying 0.5.3, 0.5.2, 0.5.1,
# 0.5.0 AND 0.2.0 at 988 MB each.
#
# That mass is what stopped the weekly pbs Servers sync converging. It went
# BACKWARDS -- 93% to 92% over five hours, moving 0.61 GiB while the target grew
# 0.79 GiB -- because the CI runner builds while rclone walks it, and the same
# run logged "error reading source directory" on a uv build tempdir that
# vanished mid-walk. pbs 2.5.0 excluded those trees; 2.5.1 stopped the SQLite
# staging walking into them too.
#
# WHAT THIS CHECK IS NOT. It is not the prune's trigger.
# container-storage-prune.service runs on its own clock, a Kagetora Host Job,
# because pruning on a schedule and alerting on a known-fixable condition are
# different jobs: an alert used as a cron means cleanup only happens when the
# alert pipeline is healthy, and it spends an agent's judgement on a
# deterministic policy. Whether the last prune FAILED is Host Units Watch's
# business, through the unit's own result. This is the slower truth that
# nothing else notices -- the stores climbing again because the prune quietly
# stopped doing anything.
#
# THRESHOLDS. 24 GB warning, 36 GB critical, on the summed image bytes of
# developer1-3 only. They sat at 13.3 GB right after the first real prune. If
# the prune dies, all three pull python-sdlc at ~988 MB most days, so about
# 3 GB/day fleet-wide: roughly three days to WARNING and a week to CRITICAL,
# which is the right window for a nightly job.
#
# WHAT IS DELIBERATELY NOT COUNTED. gha-runner-cached is reported as context
# only; its unit calls it a "persistent layer cache" and its 17.4 GiB is the
# product, so its size is not evidence of anything. Volumes are excluded as
# well: developer1's store is 2.85 GB of images and a 7.26 GB
# crunchtools-hook-cache volume, which is supposed to be big and would bury the
# signal. Only images are what the prune controls.
#
# A service that is down is reported and skipped -- gha-runner-cached runs with
# --rm and Restart=always, so it is legitimately absent between CI jobs. UNKNOWN
# means no alerted store could be read at all, i.e. the podman_exec.sh path is
# broken, not that storage is fine.
#
# Store metadata, not du: about 2s for all four, so this belongs in the fast
# pool and brings none of the memory spike that OOM-killed the NRPE daemon when
# check_backup_freshness listed pCloud live (RT #1459).
# =============================================================================

define service {
    use                     nrpe-fast-service
    host_name               gloval.dc4.crunchtools.com
    service_description     Container Storage
    check_command           check_nrpe_command!10.88.0.1!check_container_storage
    check_interval          60
    retry_interval          15
    notes                   The dev sandboxes' podman image stores are growing past what container-storage-prune should be holding them to. Check that unit's last run (systemctl status container-storage-prune) and the Kagetora Host Job that starts it. gha-runner-cached and volume caches are reported but never counted. UNKNOWN means podman_exec.sh could not read any store.
}
