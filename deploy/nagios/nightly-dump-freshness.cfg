# =============================================================================
# Nightly dump freshness — on-disk in-container DB dump age (Nagios service def)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/nightly-dump-freshness.cfg
#
# Runs check_nightly_dump on the nagios-agent via NRPE. Three services dump their
# own database nightly from a cron or timer INSIDE their own container:
#
#   learn.fatherlinux.com    my_wiki.sql + export.xml
#   rt.fatherlinux.com       rt4.sql
#   postiz.crunchtools.com   postiz-*.sql.gz
#
# Backup Freshness (check_backup_freshness) already watches the weekly pCloud
# copies, but pCloud only refreshes on the Saturday sync, so a nightly job that
# dies mid-week stays hidden behind a green pCloud sentinel for up to seven days.
# This check reads the dumps where they land first, on disk under /var/srv, and
# goes WARNING at 36h / CRITICAL at 50h — a dead cron shows the next morning.
#
# The plugin escalates to root via podman_exec (like check_git_drift): nrpe
# cannot stat postiz's 0600 dump, and loosening that mode would expose a dump
# that plausibly holds social OAuth tokens. No new mount — /var/srv is already
# ro-mounted into the agent for the drift checks.
#
# check_interval is 30, NOT the crunchtools-service default of 1. Thresholds are
# measured in hours, so a 1-minute interval is pure oversampling of one podman
# exec per run. This is cheap (a stat, not the ~490MB rclone spike that
# check_backup_freshness carries), but there is no reason to run it every minute.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Nightly Dump Freshness
    check_command           check_nrpe_command!10.88.0.1!check_nightly_dump
    check_interval          30
    retry_interval          5
    notes                   On-disk age of each in-container nightly DB dump (learn my_wiki.sql/export.xml, rt rt4.sql, postiz postiz-*.sql.gz). Red means a nightly cron/timer stopped, or a dump ran but came out below its size floor. Long output names the service; check that service's in-container cron/timer, then whether the weekly pbs dump still covers it.
}
