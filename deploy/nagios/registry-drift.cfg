# =============================================================================
# Registry drift — Nagios service definition (RT #1480 follow-on)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/registry-drift.cfg
#
# RT #1480 put all 36 container workflows on dual-push to Quay and GHCR.
# Nothing watched whether that kept working. The only registry monitoring was
# check_quay_staleness.sh on three images, and it asks "is the tag old?" rather
# than "is it the right code?" -- and never looks at GHCR at all.
#
# That gap has teeth because build-and-push-ghcr is gated on
# `needs: build-and-push-quay`. A silently failing GHCR job leaves Quay
# publishing, Quay staleness green, and the mirror rotting until the day it is
# needed. Five images were already in that state when this check first ran:
# rt, acquacotta, mcp-cloudflare, mcp-wordpress and mcp-mediawiki each had
# their version on Quay and not on GHCR.
#
# check_nrpe_ctr, NOT check_nrpe_command. There are two nrpe daemons on this
# host and both answer on 10.88.0.1: the host agent on 5666 (check_nrpe_command,
# nrpe-host.cfg) and the container agent on 5667 (check_nrpe_ctr, nrpe-ctr.cfg).
# This command lives in nrpe-ctr.cfg alongside the other check_quay_* registry
# checks, so it must be addressed through check_nrpe_ctr. Getting this wrong
# fails with "NRPE: Command 'check_registry_drift' not defined", which reads
# like a missing plugin rather than a wrong port.
#
# check_interval 60 and a long timeout: the plugin makes ~56 network calls
# against three external services per run. Polling faster costs real traffic
# and tells you nothing new -- tags do not move between builds.
#
# ON STARTING RED, and the precedent in factory-status.cfg.
#
# This ships WARNING against 38 of 56 images (26 untagged, 12 missing), and
# that was a deliberate decision -- the list IS the work it surfaces. But
# factory-status.cfg learned the hard way that a permanently-red check is not
# honest, it is ignored, and it solved that by alerting on REGRESSION past a
# baseline while keeping the absolute count in perfdata.
#
# The same option exists here and should be taken once the backlog is being
# worked rather than merely known: give the plugin untagged/missing thresholds,
# set them just above today's counts, and ratchet them down. untagged, missing,
# clean and unknown already ride in the perfdata on every run, so nothing is
# lost by making it green. Until then this is deliberately, visibly red.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               lotor.dc3.crunchtools.com
    service_description     Registry drift
    check_command           check_nrpe_ctr!10.88.0.1!check_registry_drift
    check_interval          60
    retry_interval          15
    notes                   WARNING when a published image does not carry the newest semver git tag of the repo that builds it. Two distinct findings with different fixes: "untagged" is a repo with no semver tag at all (Constitution V mandates SemVer 2.0.0) -- cut a tag; "missing" is a tag that exists but a registry has no image for it -- fix the workflow's type=semver and tags trigger. Reference is git ls-remote, so there is no token to rotate. Forks are skipped because their tags are upstream's releases, not ours, and rhel10-bootc-workstation is excluded as the only private repo (check_quay_rhel10_bootc_workstation covers it). UNKNOWN means lookups failed, not that the fleet is clean.
}
