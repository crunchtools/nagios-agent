# =============================================================================
# MCP tool call — does each MCP server still DO anything? (RT #1565)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/mcp-tool-calls.cfg
#
# THE FAILURE THIS EXISTS TO CATCH. On 2026-11-07 mcp-gemini returned
#   "Gemini API error: Attempted to call a sync close on an async stream"
# from every single tool, for an unknown number of hours. Its three services --
# container running, container memory, MCP port -- were green the entire time,
# because all three were true. The process was up and the socket accepted
# connections. Liveness was never the thing that broke. It was found by needing
# the tool, which is not monitoring.
#
# Every ctr-mcp-* host was monitored that same way, so the blind spot covered
# 23 services. Each now has one more check that opens a streamable-http session,
# calls ONE free read-only tool, and asserts a regex against the result.
#
# ASSERT THE SHAPE. That outage answered HTTP 200 with isError false and an
# error string as its content. A check that only confirmed "the server replied"
# would have stayed green. The regex per probe is the load-bearing part, and it
# lives with the tool and arguments in
# /srv/nagios-agent.crunchtools.com/config/mcp-probes.conf.
#
# check_nrpe_ctr (:5667), not :5666. Thirteen of these probes reach only
# gloval; ten reach a third party. They are allowed to be slow and must not be
# able to queue up behind the host diagnostics. nrpe-ctr-service puts them in
# nrpe-ctr-pool, so an NRPE daemon outage suppresses all 23 as one alert.
#
# check_interval 15, retry_interval 3. The liveness checks run every minute;
# this one is an API call and a tool being broken is not a second-by-second
# concern. With max_check_attempts 3 from the template, a transient blip needs
# three consecutive failures over ~6 minutes to reach HARD state and page --
# which is the whole mitigation for alerting on third-party outages.
#
# THESE PAGE. All 23 notify Hermes on CRITICAL (Scott, 2026-11-09, over the
# recommendation to stay silent on the ten upstream ones). The check cannot
# tell our bug from somebody else's outage -- an expired token, a server bug
# and GitHub being down are identical from here -- so the alert text carries a
# declared [local] or [upstream:<who>] tag and Kagetora triages on it. That
# procedure is in the "MCP tool call alerts" section of
# /srv/kagetora.crunchtools.com/data/hermes/skills/devops/podman-systemd-management/references/incident-response-runbook.md
#
# NOT COVERED: ctr-trentina.crunchtools.com. The gateway answers 410 Gone on
# /mcp without a per-profile JWT, so probing it means minting and storing a
# credential for the one service that fronts every other one. Its backends are
# now all probed individually, so a Trentina tool failure surfaces as whichever
# backend broke. Worth revisiting if the gateway grows an unauthenticated
# health path.
# =============================================================================

define service {
    use                     nrpe-ctr-service
    host_name               ctr-mcp-feeds.crunchtools.com
    service_description     MCP tool call
    check_command           check_nrpe_ctr!10.88.0.1!check_mcp_tool_feeds
    check_interval          15
    retry_interval          3
    notes                   Calls get_stats_tool and asserts real data in the result. CRITICAL means this server is reachable and useless -- the container, memory and port checks can all stay green through it, which is exactly what happened to mcp-gemini on 2026-11-07. The dependency is on gloval, so red here is OURS and there is something to do about it: read the alert text, then the container's journal. Probe defined in mcp-probes.conf.
}

