# =============================================================================
# mcp-trove dependencies — pCloud mount and index (Nagios service defs)
# =============================================================================
# Deploy to: /srv/nagios.crunchtools.com/config/services/mcp-trove.cfg
#
# The host ctr-mcp-trove.crunchtools.com and its Container memory / MCP port
# services live in container-hosts.cfg like every other MCP server. These two
# cover what trove depends on and what those three cannot see (RT #1542):
#
#   pCloud mount   mcp-trove-pcloud-mount.service keeps a read-only rclone mount
#                  at /var/mnt/pcloud. If rclone dies the empty directory stays
#                  behind; if pCloud stops answering every read hangs. Either
#                  way trove keeps running and indexes nothing.
#   Index rows     /srv/mcp-trove.crunchtools.com/data/trove.db, table files. An
#                  empty index is the one failure where the container, the port
#                  and the nightly timer all stay green.
#
# Both are in nrpe-dependency.cfg: pCloud mount on nrpe-ctr-pool, Index rows on
# nrpe-fast-pool, so an NRPE daemon outage suppresses them.
#
# check_interval 5 on the mount: each run is a podman exec plus a pCloud listing,
# and a mount does not need minute resolution. 30 on the index, which only moves
# once a night.
# =============================================================================

define service {
    use                     crunchtools-service
    host_name               ctr-mcp-trove.crunchtools.com
    service_description     pCloud mount
    check_command           check_nrpe_ctr!10.88.0.1!check_trove_pcloud_mount
    check_interval          5
    retry_interval          2
    notes                   Read-only rclone mount of pCloud at /var/mnt/pcloud that mcp-trove indexes. Red means it is not a mountpoint, or listing /var/mnt/pcloud/Documents failed or timed out. Check mcp-trove-pcloud-mount.service and its journal on lotor, then the pCloud token in /etc/rclone.conf.
}

define service {
    use                     crunchtools-service
    host_name               ctr-mcp-trove.crunchtools.com
    service_description     Index rows
    check_command           check_nrpe_command!10.88.0.1!check_trove_index
    check_interval          30
    retry_interval          5
    notes                   Row count of the files table in trove.db, read-only. Red means the database or table is missing or the index is empty. Check the last mcp-trove-index.service run, then whether the pCloud mount was up when it ran.
}
